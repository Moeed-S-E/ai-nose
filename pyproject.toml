[project]
name = "smell-ai"
version = "0.1.0"
description = "A molecule-based smell model and simulated electronic nose"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=2.0,<3.0",
    "pandas>=2.0",
    "plotly>=5.18",
    "rdkit>=2023.9.4",
    "scikit-learn>=1.3",
    "streamlit>=1.30",
]

[tool.setuptools]
py-modules = ["smell_model", "sensor", "train_nose"]
